<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل ادمین | łK¹・INVICTUS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo-area">
            <div class="clan-logo">ŁK¹</div>
            <div class="clan-title"><h1>پنل مدیریت ادمین</h1><span>دسترسی کامل Vexor</span></div>
        </div>
        <div class="nav-buttons">
            <a href="index.html" class="btn">🏠 خانه</a>
            <a href="ranking.html" class="btn">📊 رتبه‌بندی</a>
            <a href="wars.html" class="btn">⚔️ وارها</a>
            <a href="chat.html" class="btn">💬 تالار گفتگو</a>
            <a href="apply.html" class="btn">📝 ثبت‌نام تست</a>
            <a href="member_login.html" class="btn">🔑 ورود ممبر</a>
            <a href="leader_panel.html" class="btn">⚔️ پنل لیدر</a>
            <a href="admin.html" class="btn btn-admin active">🛡️ پنل ادمین</a>
        </div>
    </header>
    <div class="main-container">
        <div class="panel-card" id="aLoginBox">
            <h2 class="hero-title" style="font-size:18px; text-align:center;">🛡️ ورود ادمین (Vexor)</h2>
            <div class="form-group"><label>نام کاربری</label><input type="text" id="aUser" class="form-control" placeholder="نام کاربری..."></div>
            <div class="form-group"><label>رمز عبور</label><input type="password" id="aPass" class="form-control" placeholder="رمز عبور..."></div>
            <button onclick="aLogin()" class="btn-submit">ورود به پنل مدیریت</button>
        </div>
        
        <div class="panel-card" id="aDash" style="display:none;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                <h2 style="font-size:16px; color:var(--gold-primary);">👑 پنل کنترل Vexor</h2>
                <button onclick="localStorage.removeItem('admin_logged'); localStorage.removeItem('logged_role'); location.reload();" class="btn" style="background:var(--danger-color); color:#fff; border:none;">خروج</button>
            </div>
            <hr style="border-color:rgba(243,186,47,0.2); margin-bottom:15px;">
            <div style="display:flex; gap:10px; margin-bottom:15px;">
                <button onclick="toggleChat()" class="btn" style="flex:1; background:var(--gold-primary); color:#000; font-weight:bold;">🔒 قفل / 🔓 باز کردن تالار</button>
                <button onclick="editNotice()" class="btn" style="flex:1;">📢 ویرایش اطلاعیه</button>
            </div>

            <h3 style="font-size:14px; color:var(--gold-light); margin-bottom:8px;">📢 اعلان درخواست‌های تست عضویت</h3>
            <div id="adminApps" style="font-size:12px; color:var(--text-muted); margin-bottom:20px; background:rgba(0,0,0,0.3); padding:10px; border-radius:8px;"></div>

            <hr style="border-color:rgba(243,186,47,0.2); margin-bottom:15px;">

            <h3 id="formTitle" style="font-size:14px; color:var(--gold-light); margin-bottom:8px;">➕ افزودن ممبر جدید</h3>
            <input type="hidden" id="editIndex" value="-1">
            <div class="form-group"><label>نام و تگ در گیم</label><input type="text" id="addName" class="form-control" placeholder="ŁK¹ • Name"></div>
            <div class="grid-cards" style="margin-bottom:0;">
                <div class="form-group"><label>یوزر اکانت سایت</label><input type="text" id="addUName" class="form-control" placeholder="username"></div>
                <div class="form-group"><label>پسورد اکانت سایت</label><input type="text" id="addUPass" class="form-control" placeholder="password"></div>
            </div>
            <div class="grid-cards" style="margin-bottom:0;">
                <div class="form-group"><label>لول</label><input type="number" id="addLevel" class="form-control" placeholder="150"></div>
                <div class="form-group"><label>رنک مولتی/بتل</label><input type="text" id="addRank" class="form-control" placeholder="Legendary"></div>
            </div>
            <div class="grid-cards" style="margin-bottom:0;">
                <div class="form-group"><label>تعداد لجند</label><input type="number" id="addLegend" class="form-control" placeholder="5"></div>
                <div class="form-group"><label>کالاف یوآیدی (UID)</label><input type="text" id="addUid" class="form-control" placeholder="12345678"></div>
            </div>
            <div class="form-group"><label>نقش</label><select id="addRole" class="form-control"><option value="ممبر عادی">ممبر عادی</option><option value="لیدر">لیدر</option></select></div>
            
            <div class="form-group">
                <label>نتایج ۱۰ دست آخر مولتی (win,lose,draw,quit)</label>
                <input type="text" id="multiRes" class="form-control" value="win,win,win,win,win,win,win,win,win,win">
            </div>
            <div class="form-group">
                <label>نتایج ۱۰ دست آخر بتل (win,lose,draw,quit)</label>
                <input type="text" id="battleRes" class="form-control" value="win,win,win,win,win,win,win,win,win,win">
            </div>

            <button onclick="saveMember()" class="btn-submit">ذخیره و ثبت در سیستم</button>

            <hr style="border-color:rgba(243,186,47,0.2); margin:20px 0;">
            <h3 style="font-size:14px; color:var(--gold-light); margin-bottom:8px;">🔍 جستجو، ویرایش و حذف ممبرها</h3>
            <div class="form-group"><input type="text" id="searchAdmin" class="form-control" placeholder="جستجو بر اساس نام..." onkeyup="filterAdmin()"></div>
            <div class="table-responsive">
                <table class="clan-table">
                    <thead><tr><th>نام</th><th>یوزر</th><th>نقش</th><th>عملیات</th></tr></thead>
                    <tbody id="aTable"></tbody>
                </table>
            </div>
        </div>
    </div>
    <script>
        const BIN_ID = "6af9c49eac6210605a89891b";
        const API_KEY = "$2a$10$DZPpILN4/v8w7.tBcNSfJew7piPdaWRBuhr2mQSamEzkqhkIBrdpO";

        async function saveCloudData() {
            try {
                let payload = {
                    clan_members: JSON.parse(localStorage.getItem('clan_members') || '[]'),
                    clan_applications: JSON.parse(localStorage.getItem('clan_applications') || '[]'),
                    clan_wars: JSON.parse(localStorage.getItem('clan_wars') || '[]'),
                    chat_messages: JSON.parse(localStorage.getItem('chat_messages') || '[]'),
                    chat_bans: JSON.parse(localStorage.getItem('chat_bans') || '{}'),
                    chat_locked: localStorage.getItem('chat_locked') === 'true',
                    clan_notice: localStorage.getItem('clan_notice') || ''
                };
                await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                    method: 'PUT',
                    headers: { "Content-Type": "application/json", "X-Master-Key": API_KEY },
                    body: JSON.stringify(payload)
                });
            } catch(e) {}
        }

        async function aLogin() {
            let u = document.getElementById('aUser').value.trim();
            let p = document.getElementById('aPass').value.trim();
            if(u === "vexor" && p === "matinmnt") {
                try {
                    let res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, { headers: { "X-Master-Key": API_KEY } });
                    let data = await res.json();
                    if(data && data.record) {
                        let rec = data.record;
                        if(rec.clan_members) localStorage.setItem('clan_members', JSON.stringify(rec.clan_members));
                        if(rec.clan_applications) localStorage.setItem('clan_applications', JSON.stringify(rec.clan_applications));
                        if(rec.clan_wars) localStorage.setItem('clan_wars', JSON.stringify(rec.clan_wars));
                        if(rec.chat_messages) localStorage.setItem('chat_messages', JSON.stringify(rec.chat_messages));
                        if(rec.chat_bans) localStorage.setItem('chat_bans', JSON.stringify(rec.chat_bans));
                        localStorage.setItem('chat_locked', rec.chat_locked ? 'true' : 'false');
                        if(rec.clan_notice) localStorage.setItem('clan_notice', rec.clan_notice);
                    }
                } catch(e) {}

                localStorage.setItem('admin_logged', 'true');
                localStorage.setItem('logged_role', 'admin');
                showADash();
            } else { alert("اطلاعات ادمین اشتباه است!"); }
        }
        function showADash() {
            document.getElementById('aLoginBox').style.display = 'none';
            document.getElementById('aDash').style.display = 'block';
            loadATable();
            loadAdminApps();
        }
        function loadAdminApps() {
            let apps = JSON.parse(localStorage.getItem('clan_applications') || '[]');
            let box = document.getElementById('adminApps');
            box.innerHTML = '';
            if(apps.length === 0) { box.innerHTML = "📢 در حال حاضر هیچ درخواست تست جدیدی وجود ندارد."; return; }
            apps.forEach((a, i) => {
                box.innerHTML += `
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; border-bottom:1px dashed rgba(243,186,47,0.2); padding-bottom:6px;">
                        <div><b>${a.name}</b> (UID: ${a.uid}) - لول: ${a.level}</div>
                        <div>
                            <button onclick="adminApp(${i})" class="btn" style="background:var(--success-color); color:#fff; border:none; padding:2px 6px;">تایید</button>
                            <button onclick="adminRej(${i})" class="btn" style="background:var(--danger-color); color:#fff; border:none; padding:2px 6px; margin-right:4px;">رد</button>
                        </div>
                    </div>
                `;
            });
        }
        async function adminApp(i) {
            let apps = JSON.parse(localStorage.getItem('clan_applications') || '[]');
            let members = JSON.parse(localStorage.getItem('clan_members') || '[]');
            members.push({ 
                name: apps[i].name, 
                level: apps[i].level, 
                rank: apps[i].rank, 
                uid: apps[i].uid, 
                role: 'ممبر عادی', 
                username: 'user_'+Math.floor(Math.random()*1000), 
                password: '123', 
                multiResults:['win','win','win','win','win','win','win','win','win','win'], 
                battleResults:['win','win','win','win','win','win','win','win','win','win'] 
            });
            localStorage.setItem('clan_members', JSON.stringify(members));
            apps.splice(i, 1);
            localStorage.setItem('clan_applications', JSON.stringify(apps));
            await saveCloudData();
            alert("تایید شد!"); showADash();
        }
        async function adminRej(i) {
            let apps = JSON.parse(localStorage.getItem('clan_applications') || '[]');
            apps.splice(i, 1);
            localStorage.setItem('clan_applications', JSON.stringify(apps));
            await saveCloudData();
            alert("رد شد."); showADash();
        }
        async function saveMember() {
            let name = document.getElementById('addName').value.trim();
            let username = document.getElementById('addUName').value.trim();
            let password = document.getElementById('addUPass').value.trim();
            let level = document.getElementById('addLevel').value.trim();
            let rank = document.getElementById('addRank').value.trim();
            let legendCount = document.getElementById('addLegend').value.trim();
            let uid = document.getElementById('addUid').value.trim();
            let role = document.getElementById('addRole').value;
            let multiResults = document.getElementById('multiRes').value.split(',').map(s=>s.trim());
            let battleResults = document.getElementById('battleRes').value.split(',').map(s=>s.trim());
            let editIdx = parseInt(document.getElementById('editIndex').value);

            if(!name || !username) { alert("نام و یوزر اکانت سایت الزامی است."); return; }

            let members = JSON.parse(localStorage.getItem('clan_members') || '[]');
            if(editIdx === -1) {
                members.push({ name, username, password, level, rank, legendCount, uid, role, multiResults, battleResults });
            } else {
                members[editIdx] = { name, username, password, level, rank, legendCount, uid, role, multiResults, battleResults };
                document.getElementById('editIndex').value = -1;
                document.getElementById('formTitle').innerText = "➕ افزودن ممبر جدید";
            }
            localStorage.setItem('clan_members', JSON.stringify(members));
            await saveCloudData();
            alert("با موفقیت در سرور ابری ذخیره شد!");
            loadATable();
            clearForm();
        }
        function loadATable() {
            let members = JSON.parse(localStorage.getItem('clan_members') || '[]');
            let tbody = document.getElementById('aTable');
            tbody.innerHTML = '';
            if(members.length === 0) { tbody.innerHTML = `<tr><td colspan="4">عضوی ثبت نشده است.</td></tr>`; return; }
            members.forEach((m, i) => {
                tbody.innerHTML += `
                    <tr>
                        <td>${m.name}</td>
                        <td>${m.username || '-'}</td>
                        <td>${m.role}</td>
                        <td>
                            <button onclick="editM(${i})" class="btn" style="background:var(--gold-primary); color:#000; padding:3px 6px;">ویرایش</button>
                            <button onclick="delM(${i})" class="btn" style="background:var(--danger-color); color:#fff; padding:3px 6px; margin-right:4px;">حذف</button>
                        </td>
                    </tr>
                `;
            });
        }
        function editM(i) {
            let members = JSON.parse(localStorage.getItem('clan_members') || '[]');
            let m = members[i];
            document.getElementById('addName').value = m.name;
            document.getElementById('addUName').value = m.username || '';
            document.getElementById('addUPass').value = m.password || '';
            document.getElementById('addLevel').value = m.level || '';
            document.getElementById('addRank').value = m.rank || '';
            document.getElementById('addLegend').value = m.legendCount || '';
            document.getElementById('addUid').value = m.uid || '';
            document.getElementById('addRole').value = m.role;
            document.getElementById('multiRes').value = (m.multiResults || []).join(',');
            document.getElementById('battleRes').value = (m.battleResults || []).join(',');
            document.getElementById('editIndex').value = i;
            document.getElementById('formTitle').innerText = "✏️ ویرایش ممبر: " + m.name;
            window.scrollTo({top:0, behavior:'smooth'});
        }
        async function delM(i) {
            if(confirm("آیا از حذف این عضو اطمینان دارید؟")) {
                let members = JSON.parse(localStorage.getItem('clan_members') || '[]');
                members.splice(i, 1);
                localStorage.setItem('clan_members', JSON.stringify(members));
                await saveCloudData();
                loadATable();
            }
        }
        function clearForm() {
            document.getElementById('addName').value = '';
            document.getElementById('addUName').value = '';
            document.getElementById('addUPass').value = '';
            document.getElementById('addLevel').value = '';
            document.getElementById('addRank').value = '';
            document.getElementById('addLegend').value = '';
            document.getElementById('addUid').value = '';
        }
        async function toggleChat() {
            let cur = localStorage.getItem('chat_locked') === 'true';
            localStorage.setItem('chat_locked', !cur);
            await saveCloudData();
            alert(!cur ? "تالار گفتگو قفل شد!" : "تالار گفتگو باز شد!");
        }
        async function editNotice() {
            let t = prompt("متن جدید اطلاعیه بالای سایت را وارد کنید:");
            if(t) {
                localStorage.setItem('clan_notice', t);
                await saveCloudData();
                alert("اطلاعیه آپدیت شد!");
            }
        }
        function filterAdmin() {
            let kw = document.getElementById('searchAdmin').value.toLowerCase();
            let rows = document.getElementById('aTable').getElementsByTagName('tr');
            for(let r of rows) {
                r.style.display = r.innerText.toLowerCase().includes(kw) ? '' : 'none';
            }
        }
        window.onload = function() {
            if(localStorage.getItem('admin_logged') === 'true') showADash();
        }
    </script>
</body>
</html>
