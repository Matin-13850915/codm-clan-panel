<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل لیدرها | łK¹ • INVICTUS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo-area">
            <div class="clan-logo">ŁK¹</div>
            <div class="clan-title"><h1>پنل مدیریت لیدرها</h1><span>اعلان تست‌ها و بن چت</span></div>
        </div>
        <div class="nav-buttons">
            <a href="index.html" class="btn">🏠 خانه</a>
            <a href="ranking.html" class="btn">📊 رتبه‌بندی</a>
            <a href="wars.html" class="btn">⚔️ وارها</a>
            <a href="chat.html" class="btn">💬 تالار گفتگو</a>
            <a href="apply.html" class="btn">📝 ثبت‌نام تست</a>
            <a href="member_login.html" class="btn">🔑 ورود ممبر</a>
            <a href="leader_panel.html" class="btn active">⚔️ پنل لیدر</a>
            <a href="admin.html" class="btn btn-admin">🛡️ پنل ادمین</a>
        </div>
    </header>
    <div class="main-container">
        <div class="panel-card" id="lLoginBox">
            <h2 class="hero-title" style="font-size:18px; text-align:center;">⚔️ ورود لیدر کلن</h2>
            <div class="form-group"><label>نام کاربری</label><input type="text" id="lUser" class="form-control" placeholder="نام کاربری..."></div>
            <div class="form-group"><label>رمز عبور</label><input type="password" id="lPass" class="form-control" placeholder="رمز عبور..."></div>
            <button onclick="lLogin()" class="btn-submit">ورود به پنل لیدر</button>
        </div>
        <div class="panel-card" id="lDash" style="display:none;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                <h2 style="font-size:16px; color:var(--gold-primary);">⚔️ بخش اعلان تست‌های عضویت</h2>
                <button onclick="localStorage.removeItem('leader_logged'); localStorage.removeItem('logged_role'); location.reload();" class="btn" style="background:var(--danger-color); color:#fff; border:none;">خروج</button>
            </div>
            <div id="lApps" style="font-size:12px; color:var(--text-muted); margin-bottom:25px;"></div>
            <hr style="border-color:rgba(243,186,47,0.2); margin-bottom:20px;">
            <h3 style="font-size:14px; color:var(--gold-light); margin-bottom:10px;">🚫 مدیریت بن ۳۰ دقیقه‌ای چت ممبرها</h3>
            <div class="form-group"><label>نام ممبر</label><input type="text" id="banMemberUser" class="form-control" placeholder="نام ممبر..."></div>
            <div style="display:flex; gap:10px;">
                <button onclick="banMemberChat(30)" class="btn" style="flex:1; background:var(--danger-color); color:#fff; border:none; padding:10px;">بن ۳۰ دقیقه‌ای</button>
                <button onclick="unbanMemberChat()" class="btn" style="flex:1; background:var(--success-color); color:#fff; border:none; padding:10px;">رفع بن</button>
            </div>
        </div>
    </div>
    <script>
        const BIN_ID = "6af9c49eac6210605a89891b";
        const API_KEY = "$2a$10$DZPpILN4/v8w7.tBcNSfJew7piPdaWRBuhr2mQSamEzkqhkIBrdpO";

        async function saveCloudData() {
            try {
                let payload = {
                    clan_members: JSON.parse(localStorage.getItem('clan_members') || '[]'),
                    clan_applications: JSON.parse(localStorage.getItem('clan_applications') || '[]'),
                    clan_wars: JSON.parse(localStorage.getItem('clan_wars') || '[]'),
                    chat_messages: JSON.parse(localStorage.getItem('chat_messages') || '[]'),
                    chat_bans: JSON.parse(localStorage.getItem('chat_bans') || '{}'),
                    chat_locked: localStorage.getItem('chat_locked') === 'true',
                    clan_notice: localStorage.getItem('clan_notice') || ''
                };
                await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                    method: 'PUT',
                    headers: { "Content-Type": "application/json", "X-Master-Key": API_KEY },
                    body: JSON.stringify(payload)
                });
            } catch(e) {}
        }

        async function lLogin() {
            let u = document.getElementById('lUser').value.trim();
            let p = document.getElementById('lPass').value.trim();
            
            try {
                let res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, { headers: { "X-Master-Key": API_KEY } });
                let data = await res.json();
                let members = (data.record && data.record.clan_members) ? data.record.clan_members : [];
                let foundLeader = members.find(m => m.username === u && m.password === p && m.role === 'لیدر');

                if((u === "leader" && p === "1234") || foundLeader) {
                    localStorage.setItem('leader_logged', 'true');
                    localStorage.setItem('logged_role', 'leader');
                    localStorage.setItem('logged_member', foundLeader ? foundLeader.name : 'لیدر اصلی');
                    if(data.record) {
                        if(data.record.clan_applications) localStorage.setItem('clan_applications', JSON.stringify(data.record.clan_applications));
                        if(data.record.clan_members) localStorage.setItem('clan_members', JSON.stringify(data.record.clan_members));
                    }
                    showLDash();
                } else { alert("اطلاعات ورود لیدر اشتباه است!"); }
            } catch(e) {
                alert("خطا در اتصال به سرور ابری!");
            }
        }
        async function showLDash() {
            document.getElementById('lLoginBox').style.display = 'none';
            document.getElementById('lDash').style.display = 'block';
            let apps = JSON.parse(localStorage.getItem('clan_applications') || '[]');
            let box = document.getElementById('lApps');
            box.innerHTML = '';
            if(apps.length === 0) { box.innerHTML = "📢 در حال حاضر هیچ درخواست تست جدیدی وجود ندارد."; return; }
            apps.forEach((a, i) => {
                box.innerHTML += `
                    <div style="background:rgba(0,0,0,0.3); padding:10px; border-radius:8px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center;">
                        <div><b>${a.name}</b> (UID: ${a.uid})<br>لول: ${a.level} | رنک: ${a.rank}</div>
                        <div>
                            <button onclick="apApp(${i})" class="btn" style="background:var(--success-color); color:#fff; border:none;">تایید</button>
                            <button onclick="reApp(${i})" class="btn" style="background:var(--danger-color); color:#fff; border:none; margin-right:5px;">رد</button>
                        </div>
                    </div>
                `;
            });
        }
        async function apApp(i) {
            let apps = JSON.parse(localStorage.getItem('clan_applications') || '[]');
            let members = JSON.parse(localStorage.getItem('clan_members') || '[]');
            members.push({ 
                name: apps[i].name, 
                level: apps[i].level, 
                rank: apps[i].rank, 
                uid: apps[i].uid, 
                role: 'ممبر عادی', 
                username: 'user_'+Math.floor(Math.random()*1000), 
                password: '123', 
                multiResults:['win','win','win','win','win','win','win','win','win','win'], 
                battleResults:['win','win','win','win','win','win','win','win','win','win'] 
            });
            localStorage.setItem('clan_members', JSON.stringify(members));
            apps.splice(i, 1);
            localStorage.setItem('clan_applications', JSON.stringify(apps));
            await saveCloudData();
            alert("تایید شد و کاربر به کلن اضافه گردید!"); showLDash();
        }
        async function reApp(i) {
            let apps = JSON.parse(localStorage.getItem('clan_applications') || '[]');
            apps.splice(i, 1);
            localStorage.setItem('clan_applications', JSON.stringify(apps));
            await saveCloudData();
            alert("درخواست رد شد."); showLDash();
        }
        async function banMemberChat(mins) {
            let uname = document.getElementById('banMemberUser').value.trim();
            if(!uname) { alert("نام ممبر را وارد کنید."); return; }
            let banList = JSON.parse(localStorage.getItem('chat_bans') || '{}');
            banList[uname] = new Date().getTime() + (mins * 60 * 1000);
            localStorage.setItem('chat_bans', JSON.stringify(banList));
            await saveCloudData();
            alert("کاربر " + uname + " بن شد.");
        }
        async function unbanMemberChat() {
            let uname = document.getElementById('banMemberUser').value.trim();
            let banList = JSON.parse(localStorage.getItem('chat_bans') || '{}');
            if(banList[uname]) {
                delete banList[uname];
                localStorage.setItem('chat_bans', JSON.stringify(banList));
                await saveCloudData();
                alert("رفع بن شد.");
            } else { alert("این کاربر بن نبود."); }
        }
        window.onload = function() {
            if(localStorage.getItem('leader_logged') === 'true') showLDash();
        }
    </script>
</body>
</html>
