<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>درخواست تست عضویت | ŁK¹ • INVICTUS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo-area">
            <div class="clan-logo">ŁK¹</div>
            <div class="clan-title"><h1>درخواست تست عضویت</h1><span>پیوستن به ارتش ŁK¹</span></div>
        </div>
        <div class="nav-buttons">
            <a href="index.html" class="btn">🏠 خانه</a>
            <a href="ranking.html" class="btn">📊 رتبه‌بندی</a>
            <a href="wars.html" class="btn">⚔️ وارها</a>
            <a href="chat.html" class="btn">💬 تالار گفتگو</a>
            <a href="apply.html" class="btn active">📝 ثبت‌نام تست</a>
            <a href="member_login.html" class="btn">🔑 ورود ممبر</a>
            <a href="leader_panel.html" class="btn">⚔️ پنل لیدر</a>
            <a href="admin.html" class="btn btn-admin">🛡️ پنل ادمین</a>
        </div>
    </header>
    <div class="main-container">
        <div class="panel-card">
            <h2 class="hero-title" style="font-size: 18px;">📝 فرم ثبت‌نام تست</h2>
            <p class="hero-desc">اطلاعات اکانت خود را وارد کنید تا مستقیماً به پنل لیدر و ادمین ارسال شود.</p>
            <div class="form-group"><label>نام در گیم (با تگ)</label><input type="text" id="applyName" class="form-control" placeholder="ŁK¹ • Player"></div>
            <div class="form-group"><label>کالاف یوآیدی (UID)</label><input type="text" id="applyUid" class="form-control" placeholder="12345678"></div>
            <div class="grid-cards" style="margin-bottom:12px;">
                <div class="form-group" style="margin-bottom:0;"><label>لول</label><input type="number" id="applyLevel" class="form-control" placeholder="150"></div>
                <div class="form-group" style="margin-bottom:0;"><label>رنک مولتی/بتل</label><input type="text" id="applyRank" class="form-control" placeholder="Legendary"></div>
            </div>
            <button onclick="submitApp()" class="btn-submit">ارسال درخواست تست</button>
        </div>
    </div>
    <script>
        function submitApp() {
            let name = document.getElementById('applyName').value.trim();
            let uid = document.getElementById('applyUid').value.trim();
            let level = document.getElementById('applyLevel').value.trim();
            let rank = document.getElementById('applyRank').value.trim();
            if(!name || !uid) { alert("نام و یوآیدی الزامی است."); return; }
            let apps = JSON.parse(localStorage.getItem('clan_applications') || '[]');
            apps.push({ name, uid, level, rank });
            localStorage.setItem('clan_applications', JSON.stringify(apps));
            alert("درخواست شما با موفقیت ثبت شد!");
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
