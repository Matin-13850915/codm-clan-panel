<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تالار گفتگو | ŁK¹ • INVICTUS</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .chat-box {
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(243,186,47,0.2);
            border-radius: 12px;
            height: 350px;
            overflow-y: auto;
            padding: 15px;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .chat-msg {
            background: rgba(255,255,255,0.05);
            padding: 10px;
            border-radius: 8px;
            font-size: 12px;
            position: relative;
        }
        .chat-msg .sender {
            color: var(--gold-primary);
            font-weight: bold;
            margin-bottom: 3px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <div class="clan-logo">ŁK¹</div>
            <div class="clan-title">
                <h1>تالار گفتگوی کلن</h1>
                <span>ارتباط زنده اعضا و ارشدها</span>
            </div>
        </div>
        <div class="nav-buttons">
            <a href="index.html" class="btn">🏠 خانه</a>
            <a href="ranking.html" class="btn">📊 رتبه‌بندی</a>
            <a href="wars.html" class="btn">⚔️ وارها</a>
            <a href="chat.html" class="btn active">💬 تالار گفتگو</a>
            <a href="admin.html" class="btn btn-admin">🛡️ پنل ادمین</a>
        </div>
    </header>

    <div class="main-container">
        <div class="panel-card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h2 style="font-size: 16px; color: var(--gold-primary);">💬 چت‌روم عمومی کلن</h2>
                <span id="chatLockStatus" style="font-size: 11px; color: var(--success-color);">وضعیت: تالار باز است</span>
            </div>

            <!-- باکس پیام‌ها -->
            <div class="chat-box" id="chatContainer">
                <!-- پیام‌های نمونه -->
            </div>

            <!-- فرم ارسال پیام -->
            <div id="chatInputArea">
                <div class="form-group">
                    <input type="text" id="chatSenderName" class="form-control" placeholder="نام یا آیدی شما در چت..." style="margin-bottom: 8px;">
                    <div style="display: flex; gap: 8px;">
                        <input type="text" id="chatMessageText" class="form-control" placeholder="پیام خود را بنویسید (استیکر و متن)...">
                        <button onclick="sendChatMessage()" class="btn-submit" style="width: 100px;">ارسال</button>
                    </div>
                </div>
            </div>
            <div id="chatLockedNotice" style="display:none; color:var(--danger-color); font-size:13px; text-align:center; padding:10px;">
                🔒 تالار گفتگو قفل است و فقط ادمین‌ها و لیدها می‌توانند پیام ارسال کنند.
            </div>
        </div>
    </div>

    <script>
        window.onload = function() {
            loadChatMessages();
            checkChatLock();
        }

        function checkChatLock() {
            let isLocked = localStorage.getItem('chat_locked') === 'true';
            let currentUserRole = localStorage.getItem('logged_role') || 'member'; // تعیین نقش کاربر لاگین شده
            
            if(isLocked && currentUserRole !== 'admin' && currentUserRole !== 'leader') {
                document.getElementById('chatInputArea').style.display = 'none';
                document.getElementById('chatLockedNotice').style.display = 'block';
                document.getElementById('chatLockStatus').innerText = "وضعیت: تالار قفل است 🔒";
                document.getElementById('chatLockStatus').style.color = "var(--danger-color)";
            } else {
                document.getElementById('chatInputArea').style.display = 'block';
                document.getElementById('chatLockedNotice').style.display = 'none';
                document.getElementById('chatLockStatus').innerText = isLocked ? "وضعیت: قفل (شما ادمین/لیدرید و دسترسی دارید) 🔓" : "وضعیت: تالار باز است 🟢";
            }
        }

        function loadChatMessages() {
            let messages = JSON.parse(localStorage.getItem('chat_messages') || '[{"sender":"ŁK¹ • Ghost", "text":"سلام به همه اعضای کلن خوش آمدید!"}]');
            let container = document.getElementById('chatContainer');
            container.innerHTML = '';

            messages.forEach((m, index) => {
                container.innerHTML += `
                    <div class="chat-msg">
                        <div class="sender">${m.sender}</div>
                        <div>${m.text}</div>
                        <div style="font-size:9px; color:var(--text-muted); margin-top:4px; text-align:left;">${m.time || ''}</div>
                    </div>
                `;
            });
            container.scrollTop = container.scrollHeight;
        }

        function sendChatMessage() {
            let sender = document.getElementById('chatSenderName').value.trim();
            let text = document.getElementById('chatMessageText').value.trim();

            if(!sender || !text) {
                alert("لطفاً نام و متن پیام را وارد کنید.");
                return;
            }

            let messages = JSON.parse(localStorage.getItem('chat_messages') || '[]');
            messages.push({ sender, text, time: new Date().toLocaleTimeString() });
            localStorage.setItem('chat_messages', JSON.stringify(messages));

            document.getElementById('chatMessageText').value = '';
            loadChatMessages();
        }
    </script>
</body>
</html>
