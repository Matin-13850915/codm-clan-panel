<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تالار گفتگو | ŁK¹ • INVICTUS</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .chat-box { background: rgba(0,0,0,0.4); border: 1px solid rgba(243,186,47,0.2); border-radius: 12px; height: 320px; overflow-y: auto; padding: 15px; margin-bottom: 15px; display: flex; flex-direction: column; gap: 8px; }
        .chat-msg { background: rgba(255,255,255,0.05); padding: 8px 12px; border-radius: 8px; font-size: 12px; }
        .sender { color: var(--gold-primary); font-weight: bold; margin-bottom: 2px; }
    </style>
</head>
<body>
    <header>
        <div class="logo-area">
            <div class="clan-logo">ŁK¹</div>
            <div class="clan-title"><h1>تالار گفتگو</h1><span>ارتباط زنده اعضا</span></div>
        </div>
        <div class="nav-buttons">
            <a href="index.html" class="btn">🏠 خانه</a>
            <a href="ranking.html" class="btn">📊 رتبه‌بندی</a>
            <a href="wars.html" class="btn">⚔️ وارها</a>
            <a href="chat.html" class="btn active">💬 تالار گفتگو</a>
            <a href="apply.html" class="btn">📝 ثبت‌نام تست</a>
            <a href="member_login.html" class="btn">🔑 ورود ممبر</a>
            <a href="leader_panel.html" class="btn">⚔️ پنل لیدر</a>
            <a href="admin.html" class="btn btn-admin">🛡️ پنل ادمین</a>
        </div>
    </header>
    <div class="main-container">
        <div class="panel-card">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                <h2 style="font-size:16px; color:var(--gold-primary);">💬 چت‌روم عمومی</h2>
                <span id="chatStatus" style="font-size:11px; color:var(--success-color);">وضعیت: باز</span>
            </div>
            <div class="chat-box" id="chatContainer"></div>
            <div id="chatFormArea" style="display:none;">
                <div class="form-group" style="display:flex; gap:8px; margin-bottom:0;">
                    <input type="text" id="msgText" class="form-control" placeholder="پیام خود را بنویسید...">
                    <button onclick="sendMsg()" class="btn-submit" style="width:90px;">ارسال</button>
                </div>
            </div>
            <div id="loginNotice" style="text-align:center; color:var(--danger-color); font-size:12px;">
                ⚠️ برای ارسال پیام باید ابتدا از بخش «ورود ممبر» وارد حساب خود شوید.
            </div>
        </div>
    </div>
    <script>
        window.onload = function() {
            let loggedMember = localStorage.getItem('logged_member');
            let role = localStorage.getItem('logged_role');
            let locked = localStorage.getItem('chat_locked') === 'true';
            
            // بررسی بن ۳۰ دقیقه‌ای ممبر
            let banList = JSON.parse(localStorage.getItem('chat_bans') || '{}');
            let isBanned = false;
            if(loggedMember && banList[loggedMember]) {
                if(new Date().getTime() < banList[loggedMember]) {
                    isBanned = true;
                } else {
                    delete banList[loggedMember];
                    localStorage.setItem('chat_bans', JSON.stringify(banList));
                }
            }

            if(locked && role !== 'admin' && role !== 'leader') {
                document.getElementById('chatStatus').innerText = "وضعیت: قفل است 🔒";
                document.getElementById('chatStatus').style.color = "var(--danger-color)";
                document.getElementById('loginNotice').innerText = "🔒 تالار گفتگو توسط ادمین قفل شده است.";
                document.getElementById('loginNotice').style.display = 'block';
            } else if(isBanned) {
                document.getElementById('chatStatus').innerText = "وضعیت: بن شده‌اید 🚫";
                document.getElementById('chatStatus').style.color = "var(--danger-color)";
                document.getElementById('loginNotice').innerText = "🚫 شما توسط لیدر از چت بن شده‌اید.";
                document.getElementById('loginNotice').style.display = 'block';
            } else if(loggedMember || role) {
                document.getElementById('chatFormArea').style.display = 'block';
                document.getElementById('loginNotice').style.display = 'none';
            }
            loadChat();
        }
        function loadChat() {
            let msgs = JSON.parse(localStorage.getItem('chat_messages') || '[{"sender":"System", "text":"به تالار گفتگو خوش آمدید."}]');
            let box = document.getElementById('chatContainer');
            box.innerHTML = '';
            msgs.forEach((m, idx) => {
                box.innerHTML += `<div class="chat-msg"><div class="sender">${m.sender}</div><div>${m.text}</div></div>`;
            });
            box.scrollTop = box.scrollHeight;
        }
        function sendMsg() {
            let sender = localStorage.getItem('logged_member') || localStorage.getItem('logged_role') || 'عضو';
            let text = document.getElementById('msgText').value.trim();
            if(!text) return;
            let msgs = JSON.parse(localStorage.getItem('chat_messages') || '[]');
            msgs.push({ sender, text });
            localStorage.setItem('chat_messages', JSON.stringify(msgs));
            document.getElementById('msgText').value = '';
            loadChat();
        }
    </script>
</body>
</html>
